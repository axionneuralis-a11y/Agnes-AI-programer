<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXN Copilot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>AXN Copilot</h2>
        <span class="status online">● Online</span>
      </div>
      <div class="sidebar-tabs">
        <button class="tab active" data-tab="chat">💬 Chat</button>
        <button class="tab" data-tab="projects">📁 Projects</button>
        <button class="tab" data-tab="memory">🧠 Memory</button>
      </div>
      <div class="sidebar-content">
        <div id="chat-list" class="tab-content active">
          <div class="chat-item active">
            <div class="chat-avatar">🤖</div>
            <div class="chat-info">
              <div class="chat-name">Agnes AI</div>
              <div class="chat-preview">Siap membantu...</div>
            </div>
          </div>
        </div>
        <div id="projects-list" class="tab-content">
          <div class="projects-header"><button id="new-project-btn" class="btn-primary">+ New Project</button></div>
          <div id="projects-container"></div>
        </div>
        <div id="memory-list" class="tab-content">
          <div class="memory-header"><button id="new-memory-btn" class="btn-primary">+ New Memory</button></div>
          <div id="memory-container"></div>
        </div>
      </div>
      <div class="sidebar-footer">
        <span>🔑 GitHub · axionneuralis-a11y</span>
      </div>
    </aside>

    <main id="main">
      <div id="chat-header">
        <div class="chat-title"><span class="avatar">🤖</span> Agnes AI</div>
        <button id="clear-chat" title="Clear chat">🗑️</button>
      </div>
      <div id="messages">
        <div class="message system"><div class="message-content">👋 Selamat datang! Saya Agnes AI, asisten coding Anda.</div></div>
      </div>
      <div id="input-area">
        <div id="input-context">
          <span>📁 Project:</span>
          <select id="project-select"><option value="">-- none --</option></select>
        </div>
        <div class="input-row">
          <textarea id="message-input" rows="1" placeholder="Ketik pesan..."></textarea>
          <button id="send-btn">➤</button>
        </div>
        <div class="input-hint">Enter kirim · Shift+Enter new line</div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h3>Buat Baru</h3>
      <input id="modal-input" placeholder="Nama..." />
      <button id="modal-confirm" class="btn-primary">Buat</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
